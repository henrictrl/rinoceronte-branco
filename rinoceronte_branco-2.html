<!DOCTYPE html>
<html lang="pt-BR" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhino Studio Pro - Composição de Logos</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Configuração do Tailwind para suportar Modo Noturno via classe 'dark'
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f172a',
                        darkpanel: '#1e293b'
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/feather-icons/4.29.0/feather.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            color: #0f172a;
        }
        
        .dark body { color: #f8fafc; }

        /* SCROLLBAR CUSTOMIZADA */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }

        /* ESTILIZAÇÃO DOS SLIDERS (RANGE INPUTS) */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: #e2e8f0; 
            height: 6px;
            border-radius: 9999px;
            outline: none;
            margin: 12px 0;
            transition: background 0.3s;
        }
        
        .dark input[type=range] { background: #334155; }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 18px;
            width: 18px;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid #4f46e5;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        
        .dark input[type=range]::-webkit-slider-thumb { border-color: #818cf8; }

        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
            box-shadow: 0 3px 6px rgba(0,0,0,0.2);
        }

        /* GRID BACKGROUND (CANVAS) */
        .canvas-bg {
            /* Cor de fundo manipulada via JS */
            background-image: radial-gradient(rgba(100,100,100,0.15) 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            transition: background-color 0.3s ease;
        }
        .dark .canvas-bg {
            background-image: radial-gradient(rgba(255,255,255,0.1) 1.5px, transparent 1.5px);
        }
        
        .transition-shape {
            transition: clip-path 0.3s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.3s ease;
            transform-origin: center center;
            will-change: clip-path, transform, background-color;
        }
    </style>
</head>
<body class="h-[100dvh] w-screen overflow-hidden flex flex-col md:flex-row bg-slate-50 dark:bg-darkbg transition-colors duration-300">

    <aside class="order-2 md:order-1 w-full md:w-[420px] bg-white dark:bg-darkpanel border-t md:border-t-0 md:border-r border-slate-200 dark:border-slate-700 h-[55%] md:h-full flex flex-col shadow-[0_-10px_20px_-10px_rgba(0,0,0,0.15)] md:shadow-2xl z-20 relative transition-colors duration-300">
        
        <!-- Header -->
        <header class="p-5 border-b border-slate-100 dark:border-slate-700 flex-shrink-0 bg-white/80 dark:bg-darkpanel/80 backdrop-blur-md flex justify-between items-center transition-colors">
            <div>
                <h1 class="text-2xl font-extrabold tracking-tight">Rinoceronte Branco</h1>
            </div>
            <button onclick="toggleDarkMode()" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition">
                <i data-feather="moon" id="dark-icon" class="w-5 h-5"></i>
            </button>
        </header>

        <!-- Corpo com Scroll -->
        <div class="p-6 space-y-7 flex-grow overflow-y-auto">
            
            <!-- SEÇÃO 1: Seleção de Arte -->
            <section class="space-y-3">
                <label class="block text-sm font-semibold">1. Selecionar Composição</label>
                <div class="space-y-2" id="art-selector">
                    <!-- Grupos e Miniaturas gerados via JS -->
                </div>
            </section>

            <!-- SEÇÃO 2: Controles Geométricos -->
            <section class="space-y-4 pt-5 border-t border-slate-100 dark:border-slate-700">
                <div class="flex justify-between items-center">
                    <label class="block text-sm font-semibold">2. Forma</label>
                    <div class="flex items-center gap-2">
                        <button id="btn-undo-shape" onclick="undoShape()" class="hidden text-[10px] font-bold flex items-center gap-1 text-slate-500 bg-slate-100 dark:bg-slate-800 px-2 py-1.5 rounded" title="Desfazer">
                            <i data-feather="corner-up-left" class="w-3 h-3"></i> Voltar
                        </button>
                        <button onclick="randomizeShape()" class="text-[10px] font-bold flex items-center gap-1 text-indigo-600 bg-indigo-50 dark:bg-indigo-900/30 dark:text-indigo-400 px-2 py-1.5 rounded transition">
                            <i data-feather="shuffle" class="w-3 h-3"></i> Sortear
                        </button>
                    </div>
                </div>
                
                <div class="flex items-center gap-2">
                    <select id="shape-type-select" class="w-full p-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-600 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition font-medium">
                        <option value="star">Estrela</option>
                        <option value="polygon">Polígono Regular</option>
                        <option value="convex">Polígono Convexo</option>
                        <option value="concave">Polígono Côncavo</option>
                        <option value="complex">Polígono Complexo</option>
                        <option value="circle">Círculo / Elipse</option>
                    </select>
                    <button id="btn-regerar-irregular" onclick="regenerateIrregular()" class="hidden flex-shrink-0 p-2.5 bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg hover:text-indigo-500 transition" title="Gerar nova identidade orgânica">
                        <i data-feather="refresh-cw" class="w-4 h-4"></i>
                    </button>
                </div>

                <div id="control-points" class="space-y-1 mt-3">
                    <div class="flex justify-between text-xs text-slate-500 dark:text-slate-400 font-medium">
                        <span>Lados / Complexidade</span>
                        <span id="points-val" class="font-bold">5</span>
                    </div>
                    <input type="range" id="points-slider" min="3" max="20" value="5">
                </div>

                <div id="control-ellipse-x" class="space-y-1 mt-3 hidden">
                    <div class="flex justify-between text-xs text-slate-500 dark:text-slate-400 font-medium">
                        <span>Largura (Achatar/Alongar)</span>
                        <span id="ellipse-x-val" class="font-bold">50%</span>
                    </div>
                    <input type="range" id="ellipse-x-slider" min="5" max="50" value="50">
                </div>

                <div class="grid grid-cols-2 gap-4 pt-2">
                    <div class="space-y-1">
                        <div class="flex justify-between text-xs text-slate-500 dark:text-slate-400 font-medium">
                            <span>Escala</span>
                            <span id="scale-val">100%</span>
                        </div>
                        <input type="range" id="scale-slider" min="30" max="200" value="100">
                    </div>
                    <div id="control-rotation" class="space-y-1">
                        <div class="flex justify-between text-xs text-slate-500 dark:text-slate-400 font-medium">
                            <span>Rotação</span>
                            <span id="rotation-val">0°</span>
                        </div>
                        <input type="range" id="rotation-slider" min="0" max="360" value="0">
                    </div>
                    <div id="control-ellipse-y" class="space-y-1 hidden">
                        <div class="flex justify-between text-xs text-slate-500 dark:text-slate-400 font-medium">
                            <span>Altura (Achatar/Alongar)</span>
                            <span id="ellipse-y-val">50%</span>
                        </div>
                        <input type="range" id="ellipse-y-slider" min="5" max="50" value="50">
                    </div>
                </div>
            </section>

            <!-- SEÇÃO 3: Cor do Destaque (Forma) -->
            <section class="space-y-3 pt-5 border-t border-slate-100 dark:border-slate-700">
                <label class="block text-sm font-semibold">3. Cor do Destaque (Forma)</label>
                <input type="range" id="shape-hue" min="0" max="360" value="250" class="hue-gradient">
                <input type="range" id="shape-sat" min="0" max="100" value="85">
                <input type="range" id="shape-lig" min="0" max="100" value="65">
            </section>

            <!-- SEÇÃO 4: Cores do PNG (Apenas Lotes 2 e 3) -->
            <section id="img-group-2-controls" class="space-y-4 pt-5 border-t border-slate-100 dark:border-slate-700 hidden">
                <div class="flex justify-between items-center">
                    <label class="block text-sm font-semibold">4. Cor da Imagem</label>
                    <label class="flex items-center gap-2 cursor-pointer group" title="Ativar para Colorir (Knockout se desligado)">
                        <span class="text-[10px] font-bold text-slate-500 group-hover:text-indigo-500 transition uppercase">Preenchimento</span>
                        <div class="relative">
                            <input type="checkbox" id="img-fill-toggle" class="sr-only peer" checked>
                            <div class="w-8 h-4 bg-slate-300 dark:bg-slate-600 rounded-full peer peer-checked:bg-indigo-500 transition-colors"></div>
                            <div class="absolute left-1 top-0.5 bg-white w-3 h-3 rounded-full transition-transform peer-checked:translate-x-4"></div>
                        </div>
                    </label>
                </div>
                
                <div id="img-color-sliders">
                    <input type="range" id="img-hue" min="0" max="360" value="15" class="hue-gradient">
                    <input type="range" id="img-sat" min="0" max="100" value="85">
                    <input type="range" id="img-lig" min="0" max="100" value="55">
                </div>
            </section>

            <!-- SEÇÃO 5: Cor do Ambiente (Canvas) -->
            <section class="space-y-3 pt-5 border-t border-slate-100 dark:border-slate-700 pb-2">
                <label class="block text-sm font-semibold">5. Cor do Ambiente (Canvas)</label>
                <input type="range" id="canvas-hue" min="0" max="360" value="210" class="hue-gradient">
                <input type="range" id="canvas-sat" min="0" max="100" value="20">
                <input type="range" id="canvas-lig" min="0" max="100" value="96">
            </section>

            <!-- SEÇÃO 6: Fundo Base -->
            <section class="space-y-4 pt-5 border-t border-slate-100 dark:border-slate-700">
                <div class="flex justify-between items-center">
                    <label class="block text-sm font-semibold">6. Fundo Base</label>
                    <label class="flex items-center gap-2 cursor-pointer group" title="Liga/Desliga o fundo base">
                        <span class="text-[10px] font-bold text-slate-500 group-hover:text-indigo-500 transition uppercase">Visível</span>
                        <div class="relative">
                            <!-- Inicia desmarcado (invisível por padrão) -->
                            <input type="checkbox" id="base-visible-toggle" class="sr-only peer">
                            <div class="w-8 h-4 bg-slate-300 dark:bg-slate-600 rounded-full peer peer-checked:bg-indigo-500 transition-colors"></div>
                            <div class="absolute left-1 top-0.5 bg-white w-3 h-3 rounded-full transition-transform peer-checked:translate-x-4"></div>
                        </div>
                    </label>
                </div>

                <div id="base-controls" class="space-y-3 transition-opacity opacity-30 pointer-events-none">
                    <select id="base-type-select" class="w-full p-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-600 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition font-medium">
                        <option value="circle">Círculo</option>
                        <option value="square">Quadrado</option>
                        <option value="rounded">Quadrado Arredondado</option>
                    </select>

                    <div class="space-y-1 mt-3">
                        <div class="flex justify-between text-xs text-slate-500 dark:text-slate-400 font-medium">
                            <span>Escala do Fundo</span>
                            <span id="base-scale-val">90%</span>
                        </div>
                        <input type="range" id="base-scale-slider" min="50" max="150" value="90">
                    </div>

                    <div class="pt-2">
                        <input type="range" id="base-hue" min="0" max="360" value="200" class="hue-gradient">
                        <input type="range" id="base-sat" min="0" max="100" value="40">
                        <input type="range" id="base-lig" min="0" max="100" value="80">
                    </div>
                </div>
            </section>
        </div>

        <!-- Footer Controls -->
        <div class="p-4 md:p-5 border-t border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-darkpanel flex-shrink-0 z-10 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.05)] flex flex-col md:flex-row gap-3">
            <button onclick="downloadImage()" class="flex-1 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg hover:shadow-indigo-500/30 transition-all active:scale-[0.98] flex justify-center items-center gap-2">
                <i data-feather="download" class="w-4 h-4"></i> Baixar PNG
            </button>
            <button onclick="randomizeAll()" class="flex-1 py-3 bg-slate-900 dark:bg-slate-100 hover:bg-black dark:hover:bg-white text-white dark:text-slate-900 font-bold rounded-xl shadow-lg transition-all active:scale-[0.98] flex justify-center items-center gap-2">
                <i data-feather="shuffle" class="w-4 h-4"></i> Sortear tudo
            </button>
        </div>
    </aside>

    <!-- ÁREA PRINCIPAL (CANVAS) -->
    <main id="main-canvas" class="order-1 md:order-2 h-[45%] md:h-full md:flex-1 w-full canvas-bg flex flex-col items-center justify-center p-4 md:p-8 relative z-10 overflow-hidden">
        
        <!-- CONTAINER PARA EXPORTAÇÃO -->
        <!-- Responsive Fix: No mobile é limitado pela altura, no desktop é limitado pela largura -->
        <div id="art-container" class="relative flex items-center justify-center aspect-square h-[90%] md:h-auto w-auto max-w-[95vw] md:w-full md:max-w-[550px] transition-transform duration-300 isolate mx-auto">
            
            <!-- Fundo Base (Nova camada) -->
            <div id="base-shape" class="absolute w-[90%] h-[90%] transition-shape shadow-lg z-0"></div>

            <!-- Shape Background (Agora limitado a 80% p/ sobrar pouco em relação à imagem 75%) -->
            <div id="art-shape" class="absolute w-[80%] h-[80%] transition-shape shadow-2xl z-10"></div>
            
            <!-- Imagem PNG (Foreground - Base 75%) -->
            <div id="art-image" class="absolute w-[75%] h-[75%] bg-contain bg-center bg-no-repeat transition-all duration-300 pointer-events-none drop-shadow-[0_20px_25px_rgba(0,0,0,0.3)] flex flex-col items-center justify-center text-slate-400 text-sm font-medium text-center border-2 border-dashed border-slate-300 dark:border-slate-600 rounded-2xl bg-white/30 dark:bg-slate-800/30 backdrop-blur-sm z-20">
                <i data-feather="image" class="w-10 h-10 mb-2 opacity-50"></i>
                <span id="art-placeholder-text">Nenhuma imagem carregada</span>
            </div>

        </div>
    </main>

    <script>
        // Inicializa ícones do Feather
        feather.replace();

        // INJEÇÃO DA COR DA BARRA HUE
        document.querySelectorAll('.hue-gradient').forEach(el => {
            el.style.background = 'linear-gradient(to right, #f00 0%, #ff0 17%, #0f0 33%, #0ff 50%, #00f 67%, #f0f 83%, #f00 100%)';
        });

        // -------------------------------------------------------------------------
        // MODELO DE DADOS: Imagens Pré-carregadas (Pasta local /images/)
        // -------------------------------------------------------------------------
        const arts = [
            // Lote 1: Completos (Normais)
            { id: 0, name: 'Costanza Completo', file: 'images/Costanza Completo.png', group: 1 },
            { id: 1, name: 'Direita Completo', file: 'images/Direita Completo.png', group: 1 },
            { id: 2, name: 'Duo Completo', file: 'images/Duo Completo.png', group: 1 },
            { id: 3, name: 'Esquerda Completo', file: 'images/Esquerda Completo.png', group: 1 },
            { id: 4, name: 'Frente Completo', file: 'images/Frente Completo.png', group: 1 },
            // Lote 2: Preenchidos (Sólidos customizáveis)
            { id: 5, name: 'Costanza Preenchido', file: 'images/Costanza Preenchido.png', group: 2 },
            { id: 6, name: 'Direita Preenchido', file: 'images/Direita Preenchido.png', group: 2 },
            { id: 7, name: 'Duo Preenchido', file: 'images/Duo Preenchido.png', group: 2 },
            { id: 8, name: 'Esquerda Preenchido', file: 'images/Esquerda Preenchido.png', group: 2 },
            { id: 9, name: 'Frente Preenchido', file: 'images/Frente Preenchido.png', group: 2 },
            // Lote 3: Vazados (Customizáveis via preenchimento/knockout)
            { id: 10, name: 'Costanza Vazado', file: 'images/Costanza Vazado.png', group: 3 },
            { id: 11, name: 'Direita Vazado', file: 'images/Direita Vazado.png', group: 3 },
            { id: 12, name: 'Duo Vazado', file: 'images/Duo Vazado.png', group: 3 },
            { id: 13, name: 'Esquerda Vazado', file: 'images/Esquerda Vazado.png', group: 3 },
            { id: 14, name: 'Frente Vazado', file: 'images/Frente Vazado.png', group: 3 }
        ];

        // -------------------------------------------------------------------------
        // ESTADO GLOBAL (Source of Truth)
        // -------------------------------------------------------------------------
        const state = {
            isDark: false,
            artIndex: 0,
            base: { active: false, type: 'circle', scale: 90 },
            baseColor: { h: 200, s: 40, l: 80 },
            shape: { type: 'star', points: 5, scale: 100, rotation: 0, irregularRadii: [], ellipseX: 50, ellipseY: 50 },
            shapeColor: { h: 250, s: 85, l: 65 },
            imageColor: { h: 15, s: 85, l: 55 },
            imageFill: true, 
            canvasColor: { h: 210, s: 20, l: 96 }
        };

        const shapeHistory = [];
        const MAX_HISTORY = 10;
        const shapeSequence = ['star', 'polygon', 'convex', 'concave', 'complex'];
        let currentSequenceIndex = 0;

        // Referências DOM
        const DOM = {
            mainCanvas: document.getElementById('main-canvas'),
            imageContainer: document.getElementById('art-image'),
            shapeContainer: document.getElementById('art-shape'),
            baseContainer: document.getElementById('base-shape'),
            imgGroup2Controls: document.getElementById('img-group-2-controls'),
            imgColorSliders: document.getElementById('img-color-sliders'),
            baseControls: document.getElementById('base-controls'),
            
            inputs: {
                baseVisible: document.getElementById('base-visible-toggle'),
                baseType: document.getElementById('base-type-select'),
                baseScale: document.getElementById('base-scale-slider'),
                baseH: document.getElementById('base-hue'),
                baseS: document.getElementById('base-sat'),
                baseL: document.getElementById('base-lig'),

                shapeType: document.getElementById('shape-type-select'),
                points: document.getElementById('points-slider'),
                ellipseX: document.getElementById('ellipse-x-slider'),
                scale: document.getElementById('scale-slider'),
                rotation: document.getElementById('rotation-slider'),
                ellipseY: document.getElementById('ellipse-y-slider'),
                
                shapeH: document.getElementById('shape-hue'),
                shapeS: document.getElementById('shape-sat'),
                shapeL: document.getElementById('shape-lig'),
                
                imgH: document.getElementById('img-hue'),
                imgS: document.getElementById('img-sat'),
                imgL: document.getElementById('img-lig'),
                imgFill: document.getElementById('img-fill-toggle'),

                canvasH: document.getElementById('canvas-hue'),
                canvasS: document.getElementById('canvas-sat'),
                canvasL: document.getElementById('canvas-lig')
            },
            labels: {
                baseScale: document.getElementById('base-scale-val'),
                points: document.getElementById('points-val'),
                ellipseX: document.getElementById('ellipse-x-val'),
                scale: document.getElementById('scale-val'),
                rotation: document.getElementById('rotation-val'),
                ellipseY: document.getElementById('ellipse-y-val')
            },
            wrappers: {
                points: document.getElementById('control-points'),
                ellipseX: document.getElementById('control-ellipse-x'),
                rotation: document.getElementById('control-rotation'),
                ellipseY: document.getElementById('control-ellipse-y')
            }
        };

        function initApp() {
            buildUI();
            setupEventListeners();
            
            regenerateIrregular(false); 
            syncDOMWithState();
            renderCanvas();
        }

        function buildUI() {
            const artSelector = document.getElementById('art-selector');
            artSelector.innerHTML = ''; // Limpa caso recarregue
            
            const createLoteContainer = (title) => {
                const wrapper = document.createElement('div');
                wrapper.innerHTML = `<p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1 mt-2">${title}</p><div class="grid grid-cols-5 gap-1.5"></div>`;
                artSelector.appendChild(wrapper);
                return wrapper.querySelector('div');
            };
            
            const lote1 = createLoteContainer('Completos (Cores Originais)');
            const lote2 = createLoteContainer('Preenchidos (Cores Editáveis)');
            const lote3 = createLoteContainer('Vazados (Efeito Recorte)');
            const lotes = [lote1, lote2, lote3];

            arts.forEach((art, idx) => {
                // UI de Seleção (Miniaturas das Imagens em Grid)
                const btn = document.createElement('button');
                btn.id = `btn-art-${idx}`;
                btn.title = art.name;
                
                // Estilo da moldura
                btn.className = `aspect-square flex items-center justify-center rounded-lg border-2 overflow-hidden transition-all bg-white dark:bg-slate-800 relative group p-1 ${idx === state.artIndex ? 'border-indigo-600 shadow-md ring-2 ring-indigo-500/30' : 'border-transparent hover:border-indigo-300 dark:hover:border-indigo-700'}`;
                
                // Renderização da Miniatura
                btn.innerHTML = `<div class="w-full h-full bg-contain bg-center bg-no-repeat transition-transform group-hover:scale-110 opacity-80 group-hover:opacity-100" style="background-image: url('${art.file}');" onerror="this.style.display='none'"></div>`;
                
                btn.onclick = () => selectArt(idx);
                lotes[art.group - 1].appendChild(btn);
            });
            feather.replace();
        }

        function toggleDarkMode() {
            state.isDark = !state.isDark;
            const html = document.documentElement;
            const icon = document.getElementById('dark-icon');
            
            if (state.isDark) {
                html.classList.add('dark');
                icon.setAttribute('data-feather', 'sun');
                // Ajusta automaticamente a cor do canvas para um tom escuro agradável
                state.canvasColor = { h: 220, s: 20, l: 12 };
            } else {
                html.classList.remove('dark');
                icon.setAttribute('data-feather', 'moon');
                // Retorna canvas p/ claro
                state.canvasColor = { h: 210, s: 20, l: 96 };
            }
            feather.replace();
            syncDOMWithState();
            renderCanvas();
        }

        function handleUpload(idx, event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                arts[idx].image = e.target.result;
                const lbl = document.getElementById(`up-lbl-${idx}`);
                lbl.innerHTML = `<i data-feather="check" class="w-4 h-4 text-emerald-500"></i>`;
                feather.replace();
                selectArt(idx);
            }
            reader.readAsDataURL(file);
        }

        function selectArt(idx) {
            state.artIndex = idx;
            arts.forEach((_, i) => {
                const btn = document.getElementById(`btn-art-${i}`);
                if (i === idx) {
                    btn.className = 'aspect-square flex items-center justify-center rounded-lg border-2 overflow-hidden transition-all bg-white dark:bg-slate-800 relative group p-1 border-indigo-600 shadow-md ring-2 ring-indigo-500/30';
                } else {
                    btn.className = 'aspect-square flex items-center justify-center rounded-lg border-2 overflow-hidden transition-all bg-white dark:bg-slate-800 relative group p-1 border-transparent hover:border-indigo-300 dark:hover:border-indigo-700';
                }
            });
            renderCanvas();
        }

        function setupEventListeners() {
            // Fundo Base
            DOM.inputs.baseVisible.addEventListener('change', e => { state.base.active = e.target.checked; renderCanvas(); updateSliderBackgrounds(); });
            DOM.inputs.baseType.addEventListener('change', e => { state.base.type = e.target.value; renderCanvas(); });
            DOM.inputs.baseScale.addEventListener('input', e => { state.base.scale = parseInt(e.target.value); DOM.labels.baseScale.textContent = state.base.scale + '%'; renderCanvas(); });

            // Geometria
            DOM.inputs.shapeType.addEventListener('change', e => { saveHistory(); state.shape.type = e.target.value; syncDOMWithState(); renderCanvas(); });
            
            DOM.inputs.points.addEventListener('input', e => { 
                state.shape.points = parseInt(e.target.value);
                DOM.labels.points.textContent = state.shape.points;
                renderCanvas(); 
            });

            DOM.inputs.ellipseX.addEventListener('input', e => { 
                state.shape.ellipseX = parseInt(e.target.value);
                DOM.labels.ellipseX.textContent = state.shape.ellipseX + '%';
                renderCanvas(); 
            });

            DOM.inputs.scale.addEventListener('input', e => { 
                state.shape.scale = parseInt(e.target.value); 
                DOM.labels.scale.textContent = state.shape.scale + '%'; 
                renderCanvas(); 
            });

            DOM.inputs.rotation.addEventListener('input', e => { 
                state.shape.rotation = parseInt(e.target.value); 
                DOM.labels.rotation.textContent = state.shape.rotation + '°'; 
                renderCanvas(); 
            });

            DOM.inputs.ellipseY.addEventListener('input', e => { 
                state.shape.ellipseY = parseInt(e.target.value);
                DOM.labels.ellipseY.textContent = state.shape.ellipseY + '%';
                renderCanvas(); 
            });

            // Toggle de Imagem (Preenchimento)
            DOM.inputs.imgFill.addEventListener('change', e => {
                state.imageFill = e.target.checked;
                updateSliderBackgrounds();
                renderCanvas();
            });

            // Cores (Helper para vincular HSL genérico refatorado)
            // Agora usamos 'stateKey' para que o listener sempre procure o objeto atual dentro de 'state'
            const bindHSL = (hEl, sEl, lEl, stateKey) => {
                hEl.addEventListener('input', e => { state[stateKey].h = parseInt(e.target.value); updateSliderBackgrounds(); renderCanvas(); });
                sEl.addEventListener('input', e => { state[stateKey].s = parseInt(e.target.value); updateSliderBackgrounds(); renderCanvas(); });
                lEl.addEventListener('input', e => { state[stateKey].l = parseInt(e.target.value); updateSliderBackgrounds(); renderCanvas(); });
            };

            bindHSL(DOM.inputs.baseH, DOM.inputs.baseS, DOM.inputs.baseL, 'baseColor');
            bindHSL(DOM.inputs.shapeH, DOM.inputs.shapeS, DOM.inputs.shapeL, 'shapeColor');
            bindHSL(DOM.inputs.imgH, DOM.inputs.imgS, DOM.inputs.imgL, 'imageColor');
            bindHSL(DOM.inputs.canvasH, DOM.inputs.canvasS, DOM.inputs.canvasL, 'canvasColor');
        }

        function regenerateIrregular(triggerRender = true) {
            state.shape.irregularRadii = [];
            // Gera matriz infinita base para suportar slider indo e vindo sem perder identidade
            // Armazena valores de 0 a 1 para ser flexível entre côncavo e convexo
            for (let i = 0; i < 40; i++) {
                state.shape.irregularRadii.push(Math.random()); 
            }
            if (triggerRender) renderCanvas();
        }

        function calculateClipPath(type, points, radii) {
            if (type === 'circle') return 'circle(50% at 50% 50%)';
            const pathPoints = [];
            const center = { x: 50, y: 50 };
            const outerRadius = 50; 
            
            // Estrela e Côncavo geram vértices extras (internos) para criar as pontas/cavidades
            const isDoublePoints = (type === 'star' || type === 'concave');
            const totalSteps = points * (isDoublePoints ? 2 : 1);
            
            for (let i = 0; i < totalSteps; i++) {
                let angle = (i / totalSteps) * 2 * Math.PI - Math.PI / 2;
                let r = outerRadius;
                
                if (type === 'star') {
                    if (i % 2 !== 0) r = 22;
                } else if (type === 'concave') {
                    // Polígono Côncavo: Cavidades profundas sem cruzar linhas (ângulo intacto)
                    r = 15 + (radii[i] || 0.5) * 35;
                } else if (type === 'convex') {
                    // Polígono Convexo: Variações mínimas de raio mantendo os ângulos < 180°
                    r = 45 + (radii[i] || 0.5) * 5;
                } else if (type === 'complex') {
                    // Polígono Complexo (Auto-intersecção): Bagunçamos os ângulos intencionalmente
                    // Isso faz com que as linhas se cruzem formando intersecções entre vértices não consecutivos
                    const angleOffset = ((radii[i] || 0.5) - 0.5) * (Math.PI * 1.5);
                    angle += angleOffset;
                    r = 20 + (radii[i] || 0.5) * 30; // Raio variável para aspecto orgânico e caótico
                }

                pathPoints.push(`${(center.x + r * Math.cos(angle)).toFixed(2)}% ${(center.y + r * Math.sin(angle)).toFixed(2)}%`);
            }
            return `polygon(${pathPoints.join(', ')})`;
        }

        function updateSliderBackgrounds() {
            const applyVisuals = (h, s, l, sEl, lEl) => {
                sEl.style.background = `linear-gradient(to right, hsl(${h}, 0%, ${l}%), hsl(${h}, 100%, ${l}%))`;
                lEl.style.background = `linear-gradient(to right, hsl(${h}, ${s}%, 0%), hsl(${h}, ${s}%, 50%), hsl(${h}, ${s}%, 100%))`;
            };

            applyVisuals(state.baseColor.h, state.baseColor.s, state.baseColor.l, DOM.inputs.baseS, DOM.inputs.baseL);
            applyVisuals(state.shapeColor.h, state.shapeColor.s, state.shapeColor.l, DOM.inputs.shapeS, DOM.inputs.shapeL);
            applyVisuals(state.imageColor.h, state.imageColor.s, state.imageColor.l, DOM.inputs.imgS, DOM.inputs.imgL);
            applyVisuals(state.canvasColor.h, state.canvasColor.s, state.canvasColor.l, DOM.inputs.canvasS, DOM.inputs.canvasL);

            // Interface base (desativa visualmente se invisível)
            if(!state.base.active) {
                DOM.baseControls.style.opacity = '0.3';
                DOM.baseControls.style.pointerEvents = 'none';
            } else {
                DOM.baseControls.style.opacity = '1';
                DOM.baseControls.style.pointerEvents = 'auto';
            }

            // Escurece os sliders de imagem se o preenchimento estiver desligado
            if(!state.imageFill) {
                DOM.imgColorSliders.style.opacity = '0.3';
                DOM.imgColorSliders.style.pointerEvents = 'none';
            } else {
                DOM.imgColorSliders.style.opacity = '1';
                DOM.imgColorSliders.style.pointerEvents = 'auto';
            }
        }

        function syncDOMWithState() {
            DOM.inputs.baseVisible.checked = state.base.active;
            DOM.inputs.baseType.value = state.base.type;
            DOM.inputs.baseScale.value = state.base.scale;
            DOM.inputs.baseH.value = state.baseColor.h; DOM.inputs.baseS.value = state.baseColor.s; DOM.inputs.baseL.value = state.baseColor.l;

            DOM.inputs.shapeType.value = state.shape.type;
            DOM.inputs.points.value = state.shape.points;
            DOM.inputs.ellipseX.value = state.shape.ellipseX;
            DOM.inputs.scale.value = state.shape.scale;
            DOM.inputs.rotation.value = state.shape.rotation;
            DOM.inputs.ellipseY.value = state.shape.ellipseY;
            
            DOM.inputs.shapeH.value = state.shapeColor.h; DOM.inputs.shapeS.value = state.shapeColor.s; DOM.inputs.shapeL.value = state.shapeColor.l;
            DOM.inputs.imgH.value = state.imageColor.h; DOM.inputs.imgS.value = state.imageColor.s; DOM.inputs.imgL.value = state.imageColor.l;
            DOM.inputs.canvasH.value = state.canvasColor.h; DOM.inputs.canvasS.value = state.canvasColor.s; DOM.inputs.canvasL.value = state.canvasColor.l;
            
            DOM.inputs.imgFill.checked = state.imageFill;
            
            DOM.labels.baseScale.textContent = state.base.scale + '%';
            DOM.labels.points.textContent = state.shape.points;
            DOM.labels.ellipseX.textContent = state.shape.ellipseX + '%';
            DOM.labels.scale.textContent = state.shape.scale + '%';
            DOM.labels.rotation.textContent = state.shape.rotation + '°';
            DOM.labels.ellipseY.textContent = state.shape.ellipseY + '%';
            
            const isOrganic = state.shape.type === 'concave' || state.shape.type === 'convex' || state.shape.type === 'complex';
            document.getElementById('btn-regerar-irregular').classList.toggle('hidden', !isOrganic);

            // Alternância de controles (Círculo/Elipse vs Polígonos)
            if (state.shape.type === 'circle') {
                DOM.wrappers.points.classList.add('hidden');
                DOM.wrappers.rotation.classList.add('hidden');
                DOM.wrappers.ellipseX.classList.remove('hidden');
                DOM.wrappers.ellipseY.classList.remove('hidden');
            } else {
                DOM.wrappers.points.classList.remove('hidden');
                DOM.wrappers.rotation.classList.remove('hidden');
                DOM.wrappers.ellipseX.classList.add('hidden');
                DOM.wrappers.ellipseY.classList.add('hidden');
            }

            updateSliderBackgrounds();
        }

        function renderCanvas() {
            const art = arts[state.artIndex];
            const isCustomizable = art.group === 2 || art.group === 3;

            // --- 1. Atualizar Fundo do Canvas ---
            DOM.mainCanvas.style.backgroundColor = `hsl(${state.canvasColor.h}, ${state.canvasColor.s}%, ${state.canvasColor.l}%)`;

            // --- 2. Atualizar UI de Controle ---
            DOM.imgGroup2Controls.classList.toggle('hidden', !isCustomizable);

            // --- 3. Renderizar Imagem (Lógica Complexa de Mascaramento/Knockout) ---
            DOM.imageContainer.innerHTML = '';
            DOM.imageContainer.classList.remove('bg-white/30', 'dark:bg-slate-800/30', 'border-2', 'border-dashed', 'backdrop-blur-sm');

            if (isCustomizable) {
                // MODO SÓLIDO/VAZADO: Aplica a imagem como MÁSCARA para colorir.
                DOM.imageContainer.style.backgroundImage = 'none';
                DOM.imageContainer.style.webkitMaskImage = `url('${art.file}')`;
                DOM.imageContainer.style.webkitMaskSize = 'contain';
                DOM.imageContainer.style.webkitMaskPosition = 'center';
                DOM.imageContainer.style.webkitMaskRepeat = 'no-repeat';

                if (state.imageFill) {
                    // Preenchido: Aplica cor
                    DOM.imageContainer.style.backgroundColor = `hsl(${state.imageColor.h}, ${state.imageColor.s}%, ${state.imageColor.l}%)`;
                    DOM.imageContainer.style.mixBlendMode = 'normal';
                } else {
                    // VAZADO (Knockout): O preto na máscara corta a camada 'isolate' pai, apagando a forma de fundo.
                    DOM.imageContainer.style.backgroundColor = '#000000';
                    DOM.imageContainer.style.mixBlendMode = 'destination-out';
                }
            } else {
                // MODO NORMAL (Lote 1)
                DOM.imageContainer.style.webkitMaskImage = 'none';
                DOM.imageContainer.style.backgroundColor = 'transparent';
                DOM.imageContainer.style.mixBlendMode = 'normal';
                DOM.imageContainer.style.backgroundImage = `url('${art.file}')`;
            }

            // --- 4. Atualizar Forma Geométrica ---
            const path = calculateClipPath(state.shape.type, state.shape.points, state.shape.irregularRadii);
            DOM.shapeContainer.style.clipPath = path;
            DOM.shapeContainer.style.backgroundColor = `hsl(${state.shapeColor.h}, ${state.shapeColor.s}%, ${state.shapeColor.l}%)`;
            DOM.shapeContainer.style.transform = `scale(${state.shape.scale / 100}) rotate(${state.shape.rotation}deg)`;

            // --- 5. Renderizar Fundo Base ---
            if (state.base.active) {
                DOM.baseContainer.style.display = 'block';
                DOM.baseContainer.style.backgroundColor = `hsl(${state.baseColor.h}, ${state.baseColor.s}%, ${state.baseColor.l}%)`;
                DOM.baseContainer.style.transform = `scale(${state.base.scale / 100})`;
                
                if (state.base.type === 'circle') DOM.baseContainer.style.clipPath = 'circle(50% at 50% 50%)';
                else if (state.base.type === 'square') DOM.baseContainer.style.clipPath = 'inset(0%)';
                else if (state.base.type === 'rounded') DOM.baseContainer.style.clipPath = 'inset(0% round 15%)';
            } else {
                DOM.baseContainer.style.display = 'none';
            }
        }

        function calculateClipPath(type, points, radii) {
            if (type === 'circle') return `ellipse(${state.shape.ellipseX}% ${state.shape.ellipseY}% at 50% 50%)`;
            
            const pathPoints = [];
            const center = { x: 50, y: 50 };
            const outerRadius = 50; 
            
            // Estrela e Côncavo geram vértices extras (internos) para criar as pontas/cavidades
            const isDoublePoints = (type === 'star' || type === 'concave');
            const totalSteps = points * (isDoublePoints ? 2 : 1);
            
            for (let i = 0; i < totalSteps; i++) {
                let angle = (i / totalSteps) * 2 * Math.PI - Math.PI / 2;
                let r = outerRadius;
                
                if (type === 'star') {
                    if (i % 2 !== 0) r = 22;
                } else if (type === 'concave') {
                    // Polígono Côncavo: Cavidades profundas sem cruzar linhas (ângulo intacto)
                    r = 15 + (radii[i] || 0.5) * 35;
                } else if (type === 'convex') {
                    // Polígono Convexo: Variações mínimas de raio mantendo os ângulos < 180°
                    r = 45 + (radii[i] || 0.5) * 5;
                } else if (type === 'complex') {
                    // Polígono Complexo (Auto-intersecção): Bagunçamos os ângulos intencionalmente
                    const angleOffset = ((radii[i] || 0.5) - 0.5) * (Math.PI * 1.5);
                    angle += angleOffset;
                    r = 20 + (radii[i] || 0.5) * 30;
                }

                pathPoints.push(`${(center.x + r * Math.cos(angle)).toFixed(2)}% ${(center.y + r * Math.sin(angle)).toFixed(2)}%`);
            }
            return `polygon(${pathPoints.join(', ')})`;
        }

        function saveHistory() {
            shapeHistory.push(JSON.parse(JSON.stringify(state.shape)));
            if (shapeHistory.length > MAX_HISTORY) shapeHistory.shift();
            document.getElementById('btn-undo-shape').classList.remove('hidden');
        }

        function undoShape() {
            if (shapeHistory.length === 0) return;
            state.shape = shapeHistory.pop();
            syncDOMWithState(); renderCanvas();
            if (shapeHistory.length === 0) document.getElementById('btn-undo-shape').classList.add('hidden');
        }

        function randomizeShape() {
            saveHistory();
            state.shape.type = Math.random() < 0.15 ? 'circle' : shapeSequence[(currentSequenceIndex++) % shapeSequence.length];
            state.shape.points = Math.floor(Math.random() * 9) + 4;
            state.shape.ellipseX = Math.floor(Math.random() * 30) + 20; // 20 a 50
            state.shape.ellipseY = Math.floor(Math.random() * 30) + 20;
            state.shape.scale = Math.floor(Math.random() * 70) + 70; // 70 a 140
            state.shape.rotation = Math.floor(Math.random() * 360);
            
            const isOrganic = state.shape.type === 'concave' || state.shape.type === 'convex' || state.shape.type === 'complex';
            if (isOrganic) regenerateIrregular(false);
            
            syncDOMWithState(); renderCanvas();
        }

        const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

        function randomizeAll() {
            // Sorteia entre os 15 espaços pré-carregados
            selectArt(rand(0, 14));
            
            randomizeShape();
            
            // Fundo base agora permanece intacto (não é mais sorteado)
            
            state.shapeColor = { h: rand(0,360), s: rand(40,100), l: rand(30,70) };
            state.imageColor = { h: rand(0,360), s: rand(40,100), l: rand(30,70) };
            
            // Cor do ambiente (canvas) agora também permanece intacta

            syncDOMWithState();
            renderCanvas();
        }

        function downloadImage() {
            const container = document.getElementById('art-container');
            const imgEl = DOM.imageContainer;

            html2canvas(container, {
                backgroundColor: null, scale: 3, logging: false, allowTaint: true, useCORS: true
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `RhinoLogo_${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        window.onload = initApp;
    </script>
